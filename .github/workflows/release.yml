name: Release Build

on:
  push:
    branches:
      - main
      - master
      - release/*
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - standalone

jobs:
  build:
    name: Build release APK (${{ inputs.build_type || 'release' }})
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.10.2.4988404'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-release-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > TMessagesProj/config/release.keystore
          else
            echo "::warning::KEYSTORE_BASE64 not set, generating dummy keystore"
            keytool -genkey -v \
              -keystore TMessagesProj/config/release.keystore \
              -alias androidkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=CN"
          fi

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_BASE64" ]; then
            echo "$GOOGLE_SERVICES_BASE64" | base64 -d > TMessagesProj/google-services.json
          else
            echo "::warning::GOOGLE_SERVICES_BASE64 not set. Using dummy google-services.json"
            echo '{"project_info":{"project_number":"000000000000","project_id":"ci-build"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"org.telegram.messenger"}},"api_key":[{"current_key":"AIza00000000000000000000000000000000000"}]}]}' > TMessagesProj/google-services.json
          fi

      - name: Set keystore credentials
        run: |
          echo "RELEASE_KEY_PASSWORD=${{ secrets.KEYSTORE_PASSWORD || 'android' }}" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=${{ secrets.KEYSTORE_ALIAS || 'androidkey' }}" >> gradle.properties
          echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD || 'android' }}" >> gradle.properties

      - name: Build Release APK
        if: ${{ (inputs.build_type || 'release') != 'standalone' }}
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatRelease \
            -Dorg.gradle.jvmargs="-Xmx4g" \
            --no-daemon \
            --stacktrace

      - name: Build standalone release
        if: ${{ (inputs.build_type || 'release') == 'standalone' }}
        run: |
          ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone \
            -Dorg.gradle.jvmargs="-Xmx4g" \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            TMessagesProj_App/build/outputs/apk/afat/release/app.apk
            TMessagesProj_AppStandalone/build/outputs/apk/afat/standalone/app.apk
          retention-days: 30