name: CI Build (Debug)

on:
  push:
    branches-ignore:
      - main
      - master
      - release/*
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.10.2.4988404'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Set up keystore (dummy)
        run: |
          keytool -genkey -v \
            -keystore TMessagesProj/config/release.keystore \
            -alias androidkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=CN"

      - name: Set up google-services.json (dummy)
        run: |
          echo '{
            "project_info": {"project_number": "000000000000", "project_id": "ci-build"},
            "client": [{
              "client_info": {"mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": {"package_name": "org.telegram.messenger"}},
              "api_key": [{"current_key": "AIza00000000000000000000000000000000000"}]
            }]
          }' > TMessagesProj/google-services.json

      - name: Build Debug APK (afatDebug)
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatDebug \
            -Dorg.gradle.jvmargs="-Xmx4g" \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          retention-days: 7